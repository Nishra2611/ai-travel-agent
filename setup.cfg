[mutmut]
paths_to_mutate=src/ai_travel_agent/
backup=False
runner=python -m pytest tests/unit -x -q
tests_dir=tests/unit/

# Skip files where mutation testing adds noise, not signal:
# - dummy_tool.py: test-only stub
# - __init__.py: no logic
[mutmut.exclude]
patterns =
    src/ai_travel_agent/tools/dummy_tool.py
    **/__init__.py