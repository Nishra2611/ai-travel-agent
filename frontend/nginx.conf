server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + WebSocket calls to the backend container so the SPA
    # can call relative paths (/plan, /ws/plan, etc.) in production.
    location ~ ^/(plan|refine|export|status|health|flights|api|ws)/? {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }
}