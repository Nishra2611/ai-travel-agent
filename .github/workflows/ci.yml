name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: poetry install --with dev --no-ansi
      - name: ruff
        run: poetry run ruff check src tests
      - name: black --check
        run: poetry run black --check src tests
      - name: mypy
        run: poetry run mypy src

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: poetry install --with dev --no-ansi
      - name: Unit + integration tests with coverage
        env:
          REDIS_URL: redis://localhost:6379
          USE_FAKE_REDIS: "false"
          OLLAMA_BASE_URL: http://localhost:11434  # unused — external calls mocked in tests
        run: |
          poetry run pytest tests/unit tests/integration -m "not live_server" \
            --cov=ai_travel_agent --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=85 -v
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-travel-agent-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-travel-agent-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Railway/Render deploy
        run: |
          curl -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
        # Railway/Render deploy hooks pull the new `:latest` tag and do a
        # zero-downtime rolling restart on their end — nothing else needed
        # here as long as their health check points at /health.